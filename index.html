<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗡️ The Shattered Crown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #game-canvas {
      border: 3px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 640px;
      height: 360px;
      background: #1a1a2e;
    }

    h1 {
      text-align: center;
      font-size: 2em;
      color: #d4af37;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .info {
      text-align: center;
      color: #aaa;
      font-size: 0.9em;
    }

    .controls {
      text-align: center;
      color: #888;
      font-size: 0.8em;
      margin-top: 20px;
    }

    .controls p {
      margin: 5px 0;
    }

    .debug {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #0f0;
      font-family: monospace;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>🗡️ The Shattered Crown</h1>
    <canvas id="game-canvas" width="320" height="180"></canvas>
    <div class="info">
      <p>A Collaborative Pixelated RPG</p>
    </div>
    <div class="controls">
      <p>Controls: Arrow Keys / WASD to Move</p>
      <p>E to Interact | Enter to Confirm | ESC for Menu</p>
    </div>
  </div>
  <div class="debug" id="debug">Initializing...</div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
